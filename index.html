<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Handleliste">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>Handleliste</title>
<style>
  :root{
    --bg:#f5f6f4; --card:#fff; --text:#1d2420; --muted:#6b756f; --line:#e2e6e2;
    --accent:#2f7d4f; --accent-text:#fff; --danger:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121513; --card:#1c211e; --text:#e8ece9; --muted:#8c978f; --line:#2b332e; --accent:#4cae75; --accent-text:#0b1a11; --danger:#e07062; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 80px}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:8px;align-items:center}
  h1{font-size:20px;margin:0;flex:1}
  .status{font-size:12px;color:var(--muted)}
  .status.off::before{content:"● ";color:#d9822b}
  .status.on::before{content:"● ";color:var(--accent)}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  button.link{border:none;background:none;color:var(--muted);padding:4px 8px}
  #expandAll,#collapseAll{font-size:20px;line-height:1;padding:4px 6px}
  input,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
  input[type=text],input[type=email],input[type=password]{width:100%}
  .toolbar{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toolbar label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
  details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
  summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:8px;font-weight:600}
  summary::-webkit-details-marker{display:none}
  summary .count{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted)}
  summary::before{content:"▸";color:var(--muted);transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
  li .txt{flex:1;word-break:break-word;cursor:pointer;user-select:none}
  li.done .txt{text-decoration:line-through;color:var(--muted)}
  li input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}
  li .x{border:none;background:none;color:var(--muted);font-size:18px;padding:4px 8px}
  li .who{font-size:11px;color:var(--muted)}
  form.add{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  form.add input{flex:1}
  .login{max-width:360px;margin:15vh auto 0;display:flex;flex-direction:column;gap:10px}
  .login h1{text-align:center}
  .login-form{display:flex;flex-direction:column;gap:10px;padding:10px 14px 14px;border-top:1px solid var(--line)}
  .login button{padding:12px}
  .err{color:var(--danger);font-size:14px;min-height:1.2em}
  .empty{text-align:center;color:var(--muted);margin:40px 0}
  .tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;padding:10px 10px;font-weight:600;font-size:14px;white-space:nowrap}
  .tabs button.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--line);color:var(--text);font-size:12px;font-weight:600}
  .tabs button.active .badge{background:rgba(255,255,255,.3);color:inherit}
  .search{width:100%;margin-top:8px}
  li.need .txt{font-weight:600}
  li.need{background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .ico{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:15px;line-height:1}
  summary .ico{padding:4px 8px}
  summary input.gname{flex:1;min-width:0;font-weight:700;font-size:17px;color:var(--accent);letter-spacing:.2px;padding:6px 10px;background:transparent;border-color:transparent}
  summary input.gname:focus{background:var(--card);border-color:var(--line)}
  summary .count + .ico{margin-left:4px}
  li.edit{flex-wrap:wrap;gap:6px}
  li.edit input.t{flex:1 1 calc(100% - 90px);min-width:0;padding:10px 12px;font-size:16px;font-weight:400}
  li.edit select{flex:1 1 0;min-width:0;padding:6px 8px;font-size:13px;color:var(--muted);background:transparent}
  li.edit .ico{flex:none;padding:10px 14px}
  li.edit{padding:12px 14px}
  .grouptools{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
  .grouptools input{flex:1}
  form.newgroup{display:flex;gap:8px;margin:16px 0}
  form.newgroup input{flex:1}
  .hidden{display:none!important}
  .grip{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;border:none;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px;flex:none}
  .grip:disabled{opacity:.3;cursor:not-allowed}
  .dragging{position:relative;z-index:30;background:var(--card);box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:.97;cursor:grabbing}
  .dragging-groups details > :not(summary){display:none}
  .importbtn{display:block;width:100%;margin:0 0 12px}
  .imp{background:var(--card);border:1px solid var(--accent);border-radius:14px;margin:0 0 12px;padding:10px 0;overflow:hidden}
  .imp h3{margin:0;padding:0 14px 8px;font-size:16px}
  .imp .hint{padding:0 14px 8px;font-size:13px;color:var(--muted)}
  .imp .pad{padding:6px 14px;display:flex;flex-direction:column;gap:6px}
  .improw{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 14px;border-top:1px solid var(--line)}
  .improw .q{flex:0 0 5.5em;padding:8px}
  .improw .t{flex:1 1 9em;padding:8px}
  .improw select{flex:1 1 9em;padding:8px;font-size:13px}
  .improw .st{font-size:12px;color:var(--muted);flex:none}
  .improw .st.ok{color:var(--accent)}
  .recipe-body a{color:var(--accent)}
  textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:130px;resize:vertical}
  .recipe-body{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .recipe-body label{font-size:13px;color:var(--muted)}
  .recipe-view{white-space:pre-wrap;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
  details.inner{border:none;border-top:1px solid var(--line);border-radius:0;margin:0}
  details.inner summary{font-weight:500;font-size:14px;color:var(--muted)}
  .planrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
  .planrow select{flex:1 1 8em;padding:8px}
  .newrecipe{display:flex;gap:8px;margin:12px 0}
  .newrecipe input{flex:1}
  li input.qty{width:6em;flex:none;padding:6px 8px;font-size:14px;border-radius:8px}
  .qtyb{display:inline-block;margin-left:8px;padding:0 8px;border-radius:10px;background:var(--accent);color:var(--accent-text);font-size:13px;font-weight:600;vertical-align:1px}
  #editTools{margin:12px 0 0}
  .bulkbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:8px 12px;margin-top:12px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
  .bulkbar #bulkCount{font-weight:600;flex:1 1 100%}
  .bulkbar select{flex:1 1 0;padding:8px}
  li.edit input.sel{width:20px;height:20px;accent-color:var(--accent);flex:none}
  .dups{background:var(--card);border:1px solid var(--accent);border-radius:14px;margin:12px 0;padding:10px 14px}
  .dups h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
  .dups h3 button{margin-left:auto}
  .dupgroup{border-top:1px solid var(--line);padding:6px 0;display:flex;flex-direction:column;gap:4px}
  .duprow{display:flex;align-items:center;gap:8px}
  .duprow .n{flex:1;font-weight:600}
  .duprow .c{color:var(--muted);font-size:12px}
  .duprow button{padding:4px 10px}
  .clearbtn{display:block;width:100%;margin:16px 0;padding:12px;color:var(--danger);border-color:var(--danger)}
  .picker{padding:10px 14px;border-top:1px solid var(--line)}
  .picker input{width:100%}
  .sugg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .sugg button{text-align:left}
  .sugg .cat{color:var(--muted);font-size:13px;margin-left:4px}
  .sugg .newrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
  .sugg .newrow select{flex:1;min-width:8em;padding:8px}
  .meal-name{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .meal-name input{flex:1;font-weight:600}
  .meal-actions{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  .meal-actions button{flex:1}
  li .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
  .quickadd{display:flex;gap:8px;margin-top:8px}
  .quickadd input{flex:1}
  /* Desktop edit mode: compact table, one item per row */
  @media (min-width: 640px){
    body[data-mode=edit] .wrap{max-width:1000px}
    body[data-mode=edit] details{margin:6px 0;border-radius:8px}
    body[data-mode=edit] summary{padding:3px 10px}
    body[data-mode=edit] summary input.gname{padding:2px 8px;font-size:16px}
    body[data-mode=edit] summary .ico{padding:2px 9px}
    body[data-mode=edit] li.edit{flex-wrap:nowrap;gap:8px;padding:1px 10px}
    body[data-mode=edit] li.edit:nth-child(even){background:color-mix(in srgb,var(--text) 4%,transparent)}
    body[data-mode=edit] li.edit input.t{flex:1 1 auto;padding:3px 8px;font-size:15px;border-radius:6px;border-color:transparent;background:transparent}
    body[data-mode=edit] li.edit input.t:hover{border-color:var(--line)}
    body[data-mode=edit] li.edit input.t:focus{background:var(--card);border-color:var(--accent);outline:none}
    body[data-mode=edit] li.edit select{flex:0 0 clamp(130px,25vw,220px);padding:2px 6px;font-size:13px;border-radius:6px}
    body[data-mode=edit] li.edit .ico{padding:2px 10px;border-radius:6px}
    body[data-mode=edit] form.add{padding:3px 10px}
    body[data-mode=edit] form.add input{padding:3px 8px;border-radius:6px}
    body[data-mode=edit] form.add button{padding:2px 12px}
    body[data-mode=edit] form.newgroup{margin:10px 0}
  }
</style>
</head>
<body>

<div id="loginView" class="wrap hidden">
  <div class="login">
    <h1>🛒 Handleliste</h1>
    <button class="primary" type="button" id="googleBtn">Logg inn med Google</button>
    <div class="err" id="loginErr"></div>
    <details id="emailLogin">
      <summary>Logg inn med e-post og passord</summary>
      <form class="login-form" id="loginForm">
        <input type="email" id="email" placeholder="E-post" autocomplete="username" required>
        <input type="password" id="password" placeholder="Passord" autocomplete="current-password" required>
        <button class="primary" type="submit">Logg inn</button>
      </form>
    </details>
  </div>
</div>

<div id="appView" class="wrap hidden">
  <header>
    <div class="row">
      <h1>🛒 Handleliste</h1>
      <span class="status" id="status">kobler til…</span>
      <button class="link" id="expandAll" aria-label="Åpne alle lister" title="Åpne alle">⊞</button>
      <button class="link" id="collapseAll" aria-label="Lukk alle lister" title="Lukk alle">⊟</button>
      <button class="link" id="menuBtn" aria-label="Meny">⋯</button>
    </div>
    <div class="tabs" role="tablist">
      <button id="tabPlan" role="tab">📝 Planlegg</button>
      <button id="tabMeals" role="tab">🗓 Uke</button>
      <button id="tabShop" role="tab">🛒 Handle <span class="badge" id="shopCount">0</span></button>
      <button id="tabRecipes" role="tab">📖 Middager</button>
      <button id="tabEdit" role="tab">✏️ Rediger</button>
    </div>
    <input type="search" id="search" class="search" placeholder="Søk i alle varer…" autocomplete="off">
    <form class="quickadd" id="quickForm">
      <input type="text" id="quickText" placeholder="Legg til ny vare…" autocomplete="off">
      <select id="quickCat" aria-label="Kategori"></select>
      <button class="primary" type="submit">+</button>
    </form>
    <div class="toolbar hidden" id="menu">
      <label id="hideDoneLbl"><input type="checkbox" id="hideDone"> Skjul avkryssede</label>
      <button id="finishShop">Ferdig handlet</button>
      <button id="uncheckAll">Fjern avkryssing</button>
      <button id="clearNeeded">Tøm handlelisten</button>
      <button id="clearMeals">Tøm ukeplanen</button>
      <button id="seedBtn" class="hidden">Last inn startliste</button>
      <button id="logout">Logg ut</button>
    </div>
  </header>
  <div class="toolbar hidden" id="editTools">
    <select id="fCat" aria-label="Filtrer på kategori"></select>
    <label><input type="checkbox" id="fNeeded"> Kun på handlelisten</label>
    <select id="fSort" aria-label="Sortering">
      <option value="manual">Manuell rekkefølge</option>
      <option value="az">A–Å</option>
      <option value="new">Nyeste først</option>
    </select>
    <button id="btnDups" type="button">🔍 Finn duplikater</button>
    <button id="btnSelAll" type="button">Velg alle synlige</button>
  </div>
  <main id="list"></main>
  <div class="bulkbar hidden" id="bulkBar">
    <span id="bulkCount"></span>
    <select id="bulkCat" aria-label="Flytt til kategori"></select>
    <button id="bulkMove" type="button" class="primary">Flytt</button>
    <button id="bulkDel" type="button" class="ico" aria-label="Slett valgte">🗑</button>
    <button id="bulkClear" type="button" class="link">Fjern valg</button>
  </div>
  <div class="empty hidden" id="empty"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, doc, writeBatch, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const $ = (id) => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});
const itemsCol = collection(db, "items");

const catsCol = collection(db, "categories");
const mealsCol = collection(db, "meals");
const recipesCol = collection(db, "recipes");
let items = [];
let cats = [];          // [{id, name, order}] from Firestore
let meals = [];         // [{id, day 0-6, name, ingredients[], planned}]
const openRecipes = new Set();   // expanded dinners; cleared whenever you leave/enter the tab
let importDraft = null;   // import panel state: {stage:'paste'|'preview', ...}
let recipes = [];       // saved dinners: [{id, name, ingredients[], recipe}]
let unsub = null, unsubCats = null, unsubMeals = null, unsubRecipes = null;
let itemsLoaded = false, catsLoaded = false, pendingRender = false;
let seedOrder = [];
const seedOrderReady = fetch("seed.json").then((r) => r.json()).then((s) => { seedOrder = s.map((c) => c.name); }).catch(() => {});
const openState = JSON.parse(localStorage.getItem("openCats") || "{}");
$("hideDone").checked = localStorage.getItem("hideDone") === "1";

// ---------- auth ----------
onAuthStateChanged(auth, (user) => {
  if (user) {
    $("loginView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    subscribe();
  } else {
    if (unsub) { unsub(); unsub = null; }
    if (unsubCats) { unsubCats(); unsubCats = null; }
    if (unsubMeals) { unsubMeals(); unsubMeals = null; }
    if (unsubRecipes) { unsubRecipes(); unsubRecipes = null; }
    items = []; cats = []; meals = []; recipes = []; itemsLoaded = catsLoaded = false;
    $("appView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
  }
});

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginErr").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  } catch (err) {
    $("loginErr").textContent = "Feil e-post eller passord.";
  }
});
// Google sign-in: Google handles 2FA (if enabled on the account); Firestore rules still limit access to the two e-mails.
async function providerLogin(provider) {
  $("loginErr").textContent = "";
  try {
    await signInWithPopup(auth, provider);
  } catch (err) {
    const msgs = {
      "auth/popup-blocked": "Nettleseren blokkerte innloggingsvinduet. Tillat popup og prøv igjen.",
      "auth/account-exists-with-different-credential": "Denne e-posten er knyttet til en annen innloggingsmåte. Prøv Google eller e-post.",
      "auth/unauthorized-domain": "Domenet er ikke godkjent i Firebase (Authentication → Settings → Authorized domains).",
      "auth/operation-not-allowed": "Denne innloggingsmåten er ikke slått på i Firebase ennå."
    };
    if (["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(err.code)) return;
    $("loginErr").textContent = msgs[err.code] || ("Innlogging feilet (" + (err.code || err.message) + ").");
  }
}
$("googleBtn").addEventListener("click", () => providerLogin(new GoogleAuthProvider()));
$("logout").addEventListener("click", () => signOut(auth));

// ---------- data ----------
function subscribe() {
  if (unsub) unsub();
  if (unsubCats) unsubCats();
  if (unsubMeals) unsubMeals();
  if (unsubRecipes) unsubRecipes();
  unsubRecipes = onSnapshot(recipesCol, (snap) => {
    recipes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    safeRender();
  }, (err) => { console.error(err); alert("Ingen tilgang til middagsdatabasen – publiser oppdaterte regler (firestore.rules)."); });
  unsubMeals = onSnapshot(mealsCol, (snap) => {
    meals = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    safeRender();
  }, (err) => { console.error(err); alert("Ingen tilgang til middagsplanen – publiser oppdaterte regler (firestore.rules)."); });
  unsub = onSnapshot(itemsCol, { includeMetadataChanges: true }, (snap) => {
    items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    itemsLoaded = true;
    const st = $("status");
    const offline = snap.metadata.fromCache && !navigator.onLine;
    st.textContent = offline ? "frakoblet" : (snap.metadata.hasPendingWrites ? "synker…" : "live");
    st.className = "status " + (offline ? "off" : "on");
    ensureCategories();
    safeRender();
  }, (err) => {
    $("status").textContent = "ingen tilgang";
    $("status").className = "status off";
    console.error(err);
  });
  unsubCats = onSnapshot(catsCol, { includeMetadataChanges: true }, (snap) => {
    cats = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    // Only trust "no groups yet" once the server has answered; an empty cache must not
    // trigger the first-run setup (it would overwrite a saved order with the seed order).
    catsLoaded = !snap.metadata.fromCache;
    ensureCategories();
    safeRender();
  }, (err) => {
    $("status").textContent = "ingen tilgang (publiser nye regler?)";
    $("status").className = "status off";
    console.error(err);
  });
}

// Make failed writes visible (e.g. rules not published) instead of silently reverting.
window.addEventListener("unhandledrejection", (e) => {
  console.error(e.reason);
  alert("Kunne ikke lagre: " + (e.reason?.code || e.reason?.message || e.reason));
});

// Don't rebuild the page under someone who is typing in the edit view.
let dragActive = false;
function safeRender() {
  if (dragActive) { pendingRender = true; return; }
  const a = document.activeElement;
  const typing = a && $("list").contains(a)
    && ((a.tagName === "INPUT" && (a.type === "text" || a.type === "search")) || a.tagName === "TEXTAREA")
    && (["edit", "meals", "recipes"].includes(mode) || a.classList.contains("qty"));
  if (typing) { pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => { if (pendingRender) { pendingRender = false; setTimeout(render, 50); } });

const slug = (s) => s.toLowerCase().replace(/[^a-z0-9æøå]+/g, "-").replace(/^-|-$/g, "") || "gruppe";
let ensuring = false;
// First run after upgrade: create the group list from seed order + any categories used by items.
async function ensureCategories() {
  if (ensuring || !itemsLoaded || !catsLoaded || cats.length || !items.length) return;
  ensuring = true;
  try {
    await seedOrderReady;
    const names = [...seedOrder];
    items.forEach((i) => { if (i.category && !names.includes(i.category)) names.push(i.category); });
    await batchOver(names, (b, n) => {
      const id = slug(n);
      b.set(doc(catsCol, id), { name: n, order: names.indexOf(n) });
    });
  } catch (e) { console.error(e); } finally { ensuring = false; }
}

// Group names in display order (unknown item categories are appended)
function groupNames() {
  const names = cats.map((c) => c.name);
  items.forEach((i) => { if (i.category && !names.includes(i.category)) names.push(i.category); });
  return names;
}

async function addItem(text, category, needed = true) {
  text = text.trim();
  if (!text) return;
  const inCat = items.filter((i) => i.category === category);
  const order = inCat.length ? Math.max(...inCat.map((i) => i.order ?? 0)) + 1 : 0;
  await addDoc(itemsCol, {
    text, category, needed, checked: false, order,
    addedBy: (auth.currentUser?.email || "").split("@")[0],
    createdAt: serverTimestamp()
  });
}
// needed  = on the shopping list (chosen while planning)
// checked = in the cart (ticked while shopping; only meaningful when needed)
const upd = (it, data) => updateDoc(doc(db, "items", it.id), data);
const toggleNeeded = (it) => upd(it, { needed: !it.needed, checked: false, qty: "" });
const toggleChecked = (it) => upd(it, { checked: !it.checked });
const remove = (it) => deleteDoc(doc(db, "items", it.id));

async function batchOver(list, fn) {
  for (let i = 0; i < list.length; i += 400) {
    const b = writeBatch(db);
    list.slice(i, i + 400).forEach((it) => fn(b, it));
    await b.commit();
  }
}

const DAYS = ["Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag", "Lørdag", "Søndag"];
const mealRef = (day) => doc(db, "meals", "dag-" + day);
// Ingredients are {text, category}; tolerate plain strings.
const normIng = (list) => (list || []).map((x) => typeof x === "string" ? { text: x, category: groupNames()[0] } : x).filter((x) => x.text);
const mealIngredients = (m) => normIng(m.ingredients);
const mealItems = (m) => items.filter((i) => i.mealId === m.id);

async function saveMealName(day, name, m) {
  name = name.trim();
  if (!name) return;
  if (!m) { await setDoc(mealRef(day), { day, name, ingredients: [], planned: false }); return; }
  if (name === m.name) return;
  const b = writeBatch(db);
  b.update(mealRef(day), { name });
  mealItems(m).forEach((i) => b.update(doc(db, "items", i.id), { mealName: name }));
  await b.commit();
}
const setIngredients = (m, list) => updateDoc(mealRef(m.day), { ingredients: list });
async function deleteMeal(m) {
  if (!confirm(`Slette «${m.name}» fra ${DAYS[m.day].toLowerCase()}en?`)) return;
  const b = writeBatch(db);
  b.delete(mealRef(m.day));
  mealItems(m).forEach((i) => b.delete(doc(db, "items", i.id)));
  await b.commit();
}
// Done planning: every ingredient becomes its own shopping-list row (duplicates across dinners are kept).
async function finishMeal(m) {
  const list = mealIngredients(m);
  const b = writeBatch(db);
  const who = (auth.currentUser?.email || "").split("@")[0];
  list.forEach((ing) => {
    const master = items.find((i) => !i.mealId && i.category === ing.category && i.text === ing.text);
    b.set(doc(itemsCol), {
      text: ing.text, category: null, mealCategory: ing.category, mealId: m.id, mealName: m.name, day: m.day,
      needed: true, checked: false, qty: ing.qty || "", order: master?.order ?? 0, addedBy: who, createdAt: serverTimestamp()
    });
  });
  // Save to the dinner database (unless a saved dinner with this name already exists)
  let rid = recipes.find((r) => r.id === m.recipeId)?.id || recipes.find((r) => normName(r.name) === normName(m.name))?.id;
  if (!rid) {
    const ref = doc(recipesCol);
    b.set(ref, { name: m.name, ingredients: list, recipe: "", createdAt: serverTimestamp() });
    rid = ref.id;
  }
  b.update(mealRef(m.day), { planned: true, recipeId: rid });
  await b.commit();
}
async function reopenMeal(m) {
  const mine = mealItems(m);
  if (mine.length && !confirm(`Fjerne ${mine.length} ingredienser fra handlelisten og redigere «${m.name}»?`)) return;
  const b = writeBatch(db);
  mine.forEach((i) => b.delete(doc(db, "items", i.id)));
  b.update(mealRef(m.day), { planned: false });
  await b.commit();
}

// ---------- import (from hent_oppskrift.py) ----------
function matchItem(text) {
  const n = normName(text);
  if (!n) return null;
  const cands = items.filter((i) => !i.mealId && i.category);
  const exact = cands.find((i) => normName(i.text) === n);
  if (exact) return exact;
  let best = null;
  cands.forEach((i) => {
    const x = normName(i.text);
    if (x.length >= 4 && n.length >= 4 && (n.includes(x) || x.includes(n)) && (!best || x.length > normName(best.text).length)) best = i;
  });
  return best;
}
function parseImport(raw) {
  let j;
  try { j = JSON.parse(raw.trim()); } catch { throw new Error("Det du limte inn er ikke gyldig JSON. Kjør hent_oppskrift.py og lim inn hele resultatet."); }
  if (j?.format !== "handleliste-oppskrift" || !Array.isArray(j.ingredients)) throw new Error("Dette ser ikke ut som en oppskrift fra hent_oppskrift.py.");
  const names = groupNames();
  const fallback = names.includes(localStorage.getItem("lastNewCat")) ? localStorage.getItem("lastNewCat") : names[0];
  const ingredients = j.ingredients.map((x) => {
    const text = String(x.text ?? x.raw ?? "").trim();
    const m = matchItem(text);
    return { qty: String(x.qty ?? ""), text: m ? m.text : text, category: m ? m.category : fallback };
  }).filter((x) => x.text);
  const meta = [j.servings, j.time].filter(Boolean).join(" · ");
  const steps = (Array.isArray(j.steps) ? j.steps : []).map((t, i) => `${i + 1}. ${t}`).join("\n");
  return { stage: "preview", name: String(j.name || ""), source: String(j.source || ""), steps: (meta ? meta + "\n\n" : "") + steps, ingredients };
}
async function saveImport() {
  const d = importDraft;
  const name = d.name.trim();
  if (!name) { alert("Gi middagen et navn."); return; }
  if (recipes.some((r) => normName(r.name) === normName(name)) && !confirm(`Det finnes allerede en middag som heter «${name}». Lagre likevel?`)) return;
  const existing = (x) => items.find((i) => !i.mealId && i.category === x.category && normName(i.text) === normName(x.text));
  const ings = d.ingredients.filter((x) => x.text.trim()).map((x) => ({ qty: x.qty.trim(), category: x.category, text: existing(x)?.text ?? x.text.trim() }));
  const seen = new Set();
  for (const x of ings) {                      // unknown ingredients become permanent items (not on the shopping list)
    const k = x.category + "|" + normName(x.text);
    if (seen.has(k)) continue;
    seen.add(k);
    if (!existing(x)) await addItem(x.text, x.category, false);
  }
  const ref = await addDoc(recipesCol, { name, ingredients: ings, recipe: d.steps, source: d.source, createdAt: serverTimestamp() });
  openRecipes.add(ref.id);
  importDraft = null;
  render();
}

      <div class="pad"><textarea placeholder="Lim inn her…" aria-label="Importdata"></textarea>

const normName = (t) => t.toLocaleLowerCase("nb").replace(/[^a-z0-9æøå]/g, "");
function lev1(a, b) {   // true if edit distance <= 1
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  if (a.length === b.length) return a.slice(i + 1) === b.slice(i + 1);
  return a.length > b.length ? a.slice(i + 1) === b.slice(i) : a.slice(i) === b.slice(i + 1);
}
function findDupGroups() {
  const list = items.filter((i) => !i.mealId && i.category).map((i) => ({ it: i, n: normName(i.text) })).filter((x) => x.n);
  const parent = list.map((_, i) => i);
  const find = (x) => (parent[x] === x ? x : (parent[x] = find(parent[x])));
  for (let a = 0; a < list.length; a++) for (let b = a + 1; b < list.length; b++) {
    const x = list[a].n, y = list[b].n;
    if (x === y || (x.length >= 4 && y.length >= 4 && lev1(x, y))) parent[find(a)] = find(b);
  }
  const groups = new Map();
  list.forEach((x, i) => { const r = find(i); (groups.get(r) || groups.set(r, []).get(r)).push(x.it); });
  return [...groups.values()].filter((g) => g.length > 1);
}

// ---------- drag & drop reordering (pointer events: mouse + touch) ----------
// el: the dragged element, container: its parent; children with data-id take part.
// onDone(ids) gets the new id order; prep() may return an undo function (e.g. collapse groups while dragging).
function dragSort(e, el, container, onDone, prep) {
  if (e.button != null && e.button > 0) return;
  e.preventDefault();
  // Moving a row in the DOM would release a capture held by its own grip, so capture on <html>
  // (never moves) and listen on window: pointer events keep arriving however fast you drag.
  const pid = e.pointerId, root = document.documentElement;
  try { root.setPointerCapture(pid); } catch {}
  dragActive = true;
  const undo = prep?.();

  // Measure once. During the drag everything is arithmetic on cached sizes (no layout reads => no lag).
  const order = [...container.children].filter((c) => c.dataset.id);
  const rects = order.map((r) => r.getBoundingClientRect());
  const h = new Map(order.map((r, i) => [r, rects[i].height]));
  const gap = order.length > 1 ? Math.max(0, rects[1].top - rects[0].bottom) : 0;
  const startTop = rects[0].top + window.scrollY;           // page coordinates of the first row
  const r0 = rects[order.indexOf(el)];
  const grab = Math.min(Math.max(e.clientY - r0.top, 0), r0.height);
  const hEl = h.get(el);
  let y = e.clientY, raf = 0;
  el.classList.add("dragging");
  el.style.willChange = "transform";

  const render1 = () => {
    raf = 0;
    const wantTop = y + window.scrollY - grab;               // where the dragged row should be (page coords)
    const center = wantTop + hEl / 2;
    // target slot = number of other rows whose midpoint is above the dragged row's center
    const others = order.filter((r) => r !== el);
    let pos = startTop, target = 0;
    for (const o of others) {
      if (pos + h.get(o) / 2 < center) target++;
      pos += h.get(o) + gap;
    }
    if (order.indexOf(el) !== target) {
      order.splice(order.indexOf(el), 1);
      order.splice(target, 0, el);
      if (target >= others.length) others[others.length - 1].after(el); else others[target].before(el);
    }
    let natural = startTop;
    for (const r of order) { if (r === el) break; natural += h.get(r) + gap; }
    el.style.transform = `translateY(${wantTop - natural}px)`;
  };
  const schedule = () => { if (!raf) raf = requestAnimationFrame(render1); };
  render1();

  const move = (ev) => { if (ev.pointerId !== pid) return; y = ev.clientY; schedule(); };
  const timer = setInterval(() => {            // auto-scroll near the edges
    if (y < 70) window.scrollBy(0, -14); else if (y > window.innerHeight - 70) window.scrollBy(0, 14); else return;
    schedule();
  }, 16);
  const finish = (save) => {
    clearInterval(timer);
    if (raf) cancelAnimationFrame(raf);
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", cancel);
    try { root.releasePointerCapture(pid); } catch {}
    el.classList.remove("dragging");
    el.style.transform = ""; el.style.willChange = "";
    const ids = order.map((c) => c.dataset.id);
    undo?.();
    dragActive = false;
    pendingRender = false;
    if (save) Promise.resolve(onDone(ids)).finally(() => render()); else render();
  };
  const up = (ev) => { if (ev.pointerId === pid) finish(true); }, cancel = (ev) => { if (ev.pointerId === pid) finish(false); };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", cancel);
}

// ---------- edit operations ----------
// Persist a full group order (rewrites order 0..n so there are never ties)
async function saveGroupOrder(names) {
  const known = new Map(cats.map((c) => [c.name, c.id]));
  await batchOver(names, (b, n) => {
    const id = known.get(n) || slug(n);
    b.set(doc(catsCol, id), { name: n, order: names.indexOf(n) });
  });
}
async function moveGroup(names, i, dir) {
  document.activeElement?.blur?.(); // so the page can redraw even if a text field had focus
  pendingRender = false;
  const j = i + dir;
  if (j < 0 || j >= names.length) return;
  const next = names.slice();
  [next[i], next[j]] = [next[j], next[i]];
  await saveGroupOrder(next);
}
async function addGroup(name) {
  name = name.trim();
  if (!name) return;
  if (groupNames().some((n) => n.toLocaleLowerCase("nb") === name.toLocaleLowerCase("nb"))) { alert("Det finnes allerede en gruppe med det navnet."); return; }
  await saveGroupOrder([...groupNames(), name]);
}
async function renameGroup(oldName, newName) {
  newName = newName.trim();
  if (!newName || newName === oldName) { render(); return; }
  if (groupNames().some((n) => n !== oldName && n.toLocaleLowerCase("nb") === newName.toLocaleLowerCase("nb"))) { alert("Det finnes allerede en gruppe med det navnet."); render(); return; }
  const c = cats.find((x) => x.name === oldName);
  const affected = items.filter((i) => i.category === oldName);
  const b = writeBatch(db);
  b.set(doc(catsCol, c?.id || slug(newName)), { name: newName, order: groupNames().indexOf(oldName) });
  affected.slice(0, 450).forEach((it) => b.update(doc(db, "items", it.id), { category: newName }));
  await b.commit();
}
async function deleteGroup(name, count) {
  if (count > 0) { alert(`«${name}» har ${count} varer. Flytt eller slett dem først.`); return; }
  if (!confirm(`Slette gruppen «${name}»?`)) return;
  const c = cats.find((x) => x.name === name);
  if (c) await deleteDoc(doc(catsCol, c.id));
}
// Items: rewrite order 0..n for a group's list so swaps are stable
async function moveItem(list, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  const next = list.slice();
  [next[i], next[j]] = [next[j], next[i]];
  await batchOver(next, (b, it) => { const o = next.indexOf(it); if (it.order !== o) b.update(doc(db, "items", it.id), { order: o }); });
}
async function moveItemToGroup(it, group) {
  if (group === it.category) return;
  const inTarget = items.filter((i) => i.category === group);
  const order = inTarget.length ? Math.max(...inTarget.map((i) => i.order ?? 0)) + 1 : 0;
  await upd(it, { category: group, order });
}

// Done shopping: ticked items leave the shopping list (back to the master list, unticked)
$("finishShop").addEventListener("click", () => bulk((i) => i.needed && i.checked, { needed: false, checked: false }, (n) => `Fjerne ${n} avkryssede varer fra handlelisten?`));
$("uncheckAll").addEventListener("click", () => bulk((i) => i.needed && i.checked, { checked: false }, (n) => `Fjerne avkryssing på ${n} varer?`));
$("clearNeeded").addEventListener("click", () => bulk((i) => i.needed, { needed: false, checked: false }, (n) => `Tømme hele handlelisten (${n} varer)?`));
$("tabMeals").addEventListener("click", () => setMode("meals"));
$("tabRecipes").addEventListener("click", () => setMode("recipes"));
$("clearMeals").addEventListener("click", async () => {
  $("menu").classList.add("hidden");
  if (!meals.length || !confirm("Tømme hele ukeplanen? Ingredienser fra middagene fjernes også fra handlelisten.")) return;
  const refs = meals.map((m) => doc(db, "meals", m.id));
  items.filter((i) => i.mealId).forEach((i) => refs.push(doc(db, "items", i.id)));
  await batchOver(refs, (batch, ref) => batch.delete(ref));
});
$("seedBtn").addEventListener("click", async () => {
  if (items.length) return;
  const seed = await (await fetch("seed.json")).json();
  const rows = [];
  seed.forEach((c) => c.items.forEach((it, i) => rows.push({ text: it.text, category: c.name, needed: false, checked: false, order: i })));
  await batchOver(rows, (b, r) => b.set(doc(itemsCol), { ...r, addedBy: "import", createdAt: serverTimestamp() }));
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
