<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Handleliste">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>Handleliste</title>
<style>
  :root{
    --bg:#f5f6f4; --card:#fff; --text:#1d2420; --muted:#6b756f; --line:#e2e6e2;
    --accent:#2f7d4f; --accent-text:#fff; --danger:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121513; --card:#1c211e; --text:#e8ece9; --muted:#8c978f; --line:#2b332e; --accent:#4cae75; --accent-text:#0b1a11; --danger:#e07062; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 80px}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:8px;align-items:center}
  h1{font-size:20px;margin:0;flex:1}
  .status{font-size:12px;color:var(--muted)}
  .status.off::before{content:"● ";color:#d9822b}
  .status.on::before{content:"● ";color:var(--accent)}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  button.link{border:none;background:none;color:var(--muted);padding:4px 8px}
  input,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
  input[type=text],input[type=email],input[type=password]{width:100%}
  .toolbar{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toolbar label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
  details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
  summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:8px;font-weight:600}
  summary::-webkit-details-marker{display:none}
  summary .count{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted)}
  summary::before{content:"▸";color:var(--muted);transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
  li .txt{flex:1;word-break:break-word;cursor:pointer;user-select:none}
  li.done .txt{text-decoration:line-through;color:var(--muted)}
  li input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}
  li .x{border:none;background:none;color:var(--muted);font-size:18px;padding:4px 8px}
  li .who{font-size:11px;color:var(--muted)}
  form.add{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  form.add input{flex:1}
  .login{max-width:360px;margin:15vh auto 0;display:flex;flex-direction:column;gap:10px}
  .login h1{text-align:center}
  .err{color:var(--danger);font-size:14px;min-height:1.2em}
  .empty{text-align:center;color:var(--muted);margin:40px 0}
  .tabs{display:flex;gap:6px;margin-top:8px}
  .tabs button{flex:1;padding:10px;font-weight:600}
  .tabs button.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--line);color:var(--text);font-size:12px;font-weight:600}
  .tabs button.active .badge{background:rgba(255,255,255,.3);color:inherit}
  .search{width:100%;margin-top:8px}
  li.need .txt{font-weight:600}
  li.need{background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .ico{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:15px;line-height:1}
  summary .ico{padding:4px 8px}
  summary .count + .ico{margin-left:4px}
  li.edit{flex-wrap:wrap;gap:6px}
  li.edit input.t{flex:1 1 55%;min-width:0;padding:8px 10px}
  li.edit select{flex:1 1 30%;min-width:0;padding:8px;max-width:11em}
  li.edit .ico{flex:none}
  .grouptools{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
  .grouptools input{flex:1}
  form.newgroup{display:flex;gap:8px;margin:16px 0}
  form.newgroup input{flex:1}
  .hidden{display:none!important}
  .quickadd{display:flex;gap:8px;margin-top:8px}
  .quickadd input{flex:1}
</style>
</head>
<body>

<div id="loginView" class="wrap hidden">
  <form class="login" id="loginForm">
    <h1>🛒 Handleliste</h1>
    <input type="email" id="email" placeholder="E-post" autocomplete="username" required>
    <input type="password" id="password" placeholder="Passord" autocomplete="current-password" required>
    <button class="primary" type="submit">Logg inn</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="appView" class="wrap hidden">
  <header>
    <div class="row">
      <h1>🛒 Handleliste</h1>
      <span class="status" id="status">kobler til…</span>
      <button class="link" id="menuBtn" aria-label="Meny">⋯</button>
    </div>
    <div class="tabs" role="tablist">
      <button id="tabPlan" role="tab">📝 Planlegg</button>
      <button id="tabShop" role="tab">🛒 Handle <span class="badge" id="shopCount">0</span></button>
      <button id="tabEdit" role="tab">✏️ Rediger</button>
    </div>
    <input type="search" id="search" class="search" placeholder="Søk i alle varer…" autocomplete="off">
    <form class="quickadd" id="quickForm">
      <input type="text" id="quickText" placeholder="Legg til ny vare…" autocomplete="off">
      <select id="quickCat" aria-label="Kategori"></select>
      <button class="primary" type="submit">+</button>
    </form>
    <div class="toolbar hidden" id="menu">
      <label id="hideDoneLbl"><input type="checkbox" id="hideDone"> Skjul avkryssede</label>
      <button id="finishShop">Ferdig handlet</button>
      <button id="uncheckAll">Fjern avkryssing</button>
      <button id="clearNeeded">Tøm handlelisten</button>
      <button id="seedBtn" class="hidden">Last inn startliste</button>
      <button id="logout">Logg ut</button>
    </div>
  </header>
  <main id="list"></main>
  <div class="empty hidden" id="empty"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, doc, writeBatch, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const $ = (id) => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});
const itemsCol = collection(db, "items");

const catsCol = collection(db, "categories");
let items = [];
let cats = [];          // [{id, name, order}] from Firestore
let unsub = null, unsubCats = null;
let itemsLoaded = false, catsLoaded = false, pendingRender = false;
let seedOrder = [];
const seedOrderReady = fetch("seed.json").then((r) => r.json()).then((s) => { seedOrder = s.map((c) => c.name); }).catch(() => {});
const openState = JSON.parse(localStorage.getItem("openCats") || "{}");
$("hideDone").checked = localStorage.getItem("hideDone") === "1";

// ---------- auth ----------
onAuthStateChanged(auth, (user) => {
  if (user) {
    $("loginView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    subscribe();
  } else {
    if (unsub) { unsub(); unsub = null; }
    if (unsubCats) { unsubCats(); unsubCats = null; }
    items = []; cats = []; itemsLoaded = catsLoaded = false;
    $("appView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
  }
});

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginErr").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  } catch (err) {
    $("loginErr").textContent = "Feil e-post eller passord.";
  }
});
$("logout").addEventListener("click", () => signOut(auth));

// ---------- data ----------
function subscribe() {
  if (unsub) unsub();
  if (unsubCats) unsubCats();
  unsub = onSnapshot(itemsCol, { includeMetadataChanges: true }, (snap) => {
    items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    itemsLoaded = true;
    const st = $("status");
    const offline = snap.metadata.fromCache && !navigator.onLine;
    st.textContent = offline ? "frakoblet" : (snap.metadata.hasPendingWrites ? "synker…" : "live");
    st.className = "status " + (offline ? "off" : "on");
    ensureCategories();
    safeRender();
  }, (err) => {
    $("status").textContent = "ingen tilgang";
    $("status").className = "status off";
    console.error(err);
  });
  unsubCats = onSnapshot(catsCol, (snap) => {
    cats = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    catsLoaded = true;
    ensureCategories();
    safeRender();
  }, (err) => {
    $("status").textContent = "ingen tilgang (publiser nye regler?)";
    $("status").className = "status off";
    console.error(err);
  });
}

// Don't rebuild the page under someone who is typing in the edit view.
function safeRender() {
  const a = document.activeElement;
  if (mode === "edit" && a && a.tagName === "INPUT" && a.type === "text" && $("list").contains(a)) { pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => { if (pendingRender) { pendingRender = false; setTimeout(render, 50); } });

const slug = (s) => s.toLowerCase().replace(/[^a-z0-9æøå]+/g, "-").replace(/^-|-$/g, "") || "gruppe";
let ensuring = false;
// First run after upgrade: create the group list from seed order + any categories used by items.
async function ensureCategories() {
  if (ensuring || !itemsLoaded || !catsLoaded || cats.length || !items.length) return;
  ensuring = true;
  try {
    await seedOrderReady;
    const names = [...seedOrder];
    items.forEach((i) => { if (i.category && !names.includes(i.category)) names.push(i.category); });
    await batchOver(names, (b, n) => {
      const id = slug(n);
      b.set(doc(catsCol, id), { name: n, order: names.indexOf(n) });
    });
  } catch (e) { console.error(e); } finally { ensuring = false; }
}

// Group names in display order (unknown item categories are appended)
function groupNames() {
  const names = cats.map((c) => c.name);
  items.forEach((i) => { if (i.category && !names.includes(i.category)) names.push(i.category); });
  return names;
}

async function addItem(text, category, needed = true) {
  text = text.trim();
  if (!text) return;
  const inCat = items.filter((i) => i.category === category);
  const order = inCat.length ? Math.max(...inCat.map((i) => i.order ?? 0)) + 1 : 0;
  await addDoc(itemsCol, {
    text, category, needed, checked: false, order,
    addedBy: (auth.currentUser?.email || "").split("@")[0],
    createdAt: serverTimestamp()
  });
}
// needed  = on the shopping list (chosen while planning)
// checked = in the cart (ticked while shopping; only meaningful when needed)
const upd = (it, data) => updateDoc(doc(db, "items", it.id), data);
const toggleNeeded = (it) => upd(it, { needed: !it.needed, checked: false });
const toggleChecked = (it) => upd(it, { checked: !it.checked });
const remove = (it) => deleteDoc(doc(db, "items", it.id));

async function batchOver(list, fn) {
  for (let i = 0; i < list.length; i += 400) {
    const b = writeBatch(db);
    list.slice(i, i + 400).forEach((it) => fn(b, it));
    await b.commit();
  }
}

// ---------- render ----------
let mode = ["shop", "edit"].includes(localStorage.getItem("mode")) ? localStorage.getItem("mode") : "plan";

const cmpItems = (a, b) => ((a.order ?? 0) - (b.order ?? 0)) || a.text.localeCompare(b.text, "nb");

function render() {
  const shop = mode === "shop", edit = mode === "edit";
  const q = $("search").value.trim().toLocaleLowerCase("nb");
  const hide = shop && $("hideDone").checked;

  const names = groupNames();
  const byCat = new Map(names.map((n) => [n, []]));
  items.forEach((it) => byCat.get(it.category)?.push(it));

  const neededCount = items.filter((i) => i.needed).length;
  $("shopCount").textContent = neededCount;
  $("tabPlan").classList.toggle("active", mode === "plan");
  $("tabShop").classList.toggle("active", shop);
  $("tabEdit").classList.toggle("active", edit);
  $("search").classList.toggle("hidden", shop);
  $("quickForm").classList.toggle("hidden", shop || edit);
  $("hideDoneLbl").classList.toggle("hidden", !shop);
  $("finishShop").classList.toggle("hidden", !shop);
  $("uncheckAll").classList.toggle("hidden", !shop);

  const sel = $("quickCat"); const keep = sel.value;
  sel.innerHTML = names.map((c) => `<option>${esc(c)}</option>`).join("");
  if (names.includes(keep)) sel.value = keep;

  $("seedBtn").classList.toggle("hidden", items.length > 0);
  const empty = $("empty");
  empty.classList.toggle("hidden", !(items.length === 0 || (shop && neededCount === 0)));
  empty.textContent = items.length === 0
    ? "Listen er tom. Åpne «⋯» og velg «Last inn startliste»."
    : "Handlelisten er tom. Gå til «Planlegg» og trykk på varene du trenger.";

  const root = $("list");
  root.innerHTML = "";
  names.forEach((cat, gi) => {
    const all = byCat.get(cat);
    let list = all.slice();
    const need = all.filter((i) => i.needed).length;
    if (shop) list = list.filter((i) => i.needed);
    else if (q) list = list.filter((i) => i.text.toLocaleLowerCase("nb").includes(q));
    if (hide) list = list.filter((i) => !i.checked);
    if (!list.length && (shop || (q && !edit))) return;
    if (!list.length && edit && q) return;
    list.sort(shop ? (a, b) => (!!a.checked - !!b.checked) || cmpItems(a, b) : cmpItems);

    const key = (shop ? "s:" : edit ? "e:" : "p:") + cat;
    const d = document.createElement("details");
    d.open = q ? true : (openState[key] ?? !edit);
    d.addEventListener("toggle", () => { if (q) return; openState[key] = d.open; localStorage.setItem("openCats", JSON.stringify(openState)); });
    const count = shop ? `${all.filter((i) => i.needed && !i.checked).length} igjen` : edit ? `${all.length}` : (need ? `${need} valgt` : "");
    const sum = document.createElement("summary");
    sum.innerHTML = `${esc(cat)}<span class="count">${count}</span>`;
    if (edit) {
      for (const [label, dir] of [["▲", -1], ["▼", 1]]) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "ico"; b.textContent = label;
        b.setAttribute("aria-label", dir < 0 ? "Flytt gruppe opp" : "Flytt gruppe ned");
        b.disabled = (dir < 0 && gi === 0) || (dir > 0 && gi === names.length - 1);
        b.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); moveGroup(names, gi, dir); });
        sum.appendChild(b);
      }
    }
    d.appendChild(sum);

    if (edit) {
      // group tools: rename + delete
      const gt = document.createElement("div");
      gt.className = "grouptools";
      gt.innerHTML = `<input type="text" value="${esc(cat)}" aria-label="Gruppenavn"><button class="ico" type="button" aria-label="Slett gruppe">🗑</button>`;
      const nameInp = gt.querySelector("input");
      nameInp.addEventListener("change", () => renameGroup(cat, nameInp.value));
      gt.querySelector("button").addEventListener("click", () => deleteGroup(cat, all.length));
      d.appendChild(gt);
    }

    const ul = document.createElement("ul");
    list.forEach((it, idx) => {
      const li = document.createElement("li");
      if (edit) {
        li.className = "edit";
        li.innerHTML = `<input class="t" type="text" value="${esc(it.text)}" aria-label="Varenavn">
          <select aria-label="Flytt til gruppe">${names.map((n) => `<option ${n === cat ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
          <button class="ico" type="button" aria-label="Opp">▲</button>
          <button class="ico" type="button" aria-label="Ned">▼</button>
          <button class="ico" type="button" aria-label="Slett">✕</button>`;
        const [up, down, del] = li.querySelectorAll("button");
        up.disabled = !!q || idx === 0;
        down.disabled = !!q || idx === list.length - 1;
        const inp = li.querySelector("input");
        inp.addEventListener("change", () => { const t = inp.value.trim(); if (t && t !== it.text) upd(it, { text: t }); else inp.value = it.text; });
        li.querySelector("select").addEventListener("change", (e) => moveItemToGroup(it, e.target.value));
        up.addEventListener("click", () => moveItem(list, idx, -1));
        down.addEventListener("click", () => moveItem(list, idx, 1));
        del.addEventListener("click", () => { if (confirm(`Slette «${it.text}» for godt?`)) remove(it); });
      } else {
        const on = shop ? it.checked : it.needed;
        li.className = shop ? (it.checked ? "done" : "") : (it.needed ? "need" : "");
        li.innerHTML = `<input type="checkbox" ${on ? "checked" : ""} aria-label="${shop ? "I handlekurven" : "Trenger"}">
          <span class="txt">${esc(it.text)}</span>
          <button class="x" aria-label="${shop ? "Fjern fra handlelisten" : "Slett vare"}">✕</button>`;
        const act = () => (shop ? toggleChecked(it) : toggleNeeded(it));
        li.querySelector("input").addEventListener("change", act);
        li.querySelector(".txt").addEventListener("click", act);
        li.querySelector(".x").addEventListener("click", () => {
          if (shop) upd(it, { needed: false, checked: false });
          else if (confirm(`Slette «${it.text}» fra varelisten for godt?`)) remove(it);
        });
      }
      ul.appendChild(li);
    });
    d.appendChild(ul);
    if (!shop) {
      const f = document.createElement("form");
      f.className = "add";
      f.innerHTML = `<input type="text" placeholder="Ny vare i ${esc(cat)}…" autocomplete="off"><button type="submit">+</button>`;
      f.addEventListener("submit", (e) => { e.preventDefault(); const inp = f.querySelector("input"); addItem(inp.value, cat, !edit); inp.value = ""; });
      d.appendChild(f);
    }
    root.appendChild(d);
  });

  if (edit && !q) {
    const f = document.createElement("form");
    f.className = "newgroup";
    f.innerHTML = `<input type="text" placeholder="Ny gruppe…" autocomplete="off"><button class="primary" type="submit">Legg til gruppe</button>`;
    f.addEventListener("submit", (e) => { e.preventDefault(); const inp = f.querySelector("input"); addGroup(inp.value); inp.value = ""; });
    root.appendChild(f);
  }
}

// ---------- edit operations ----------
// Persist a full group order (rewrites order 0..n so there are never ties)
async function saveGroupOrder(names) {
  const known = new Map(cats.map((c) => [c.name, c.id]));
  await batchOver(names, (b, n) => {
    const id = known.get(n) || slug(n);
    b.set(doc(catsCol, id), { name: n, order: names.indexOf(n) });
  });
}
async function moveGroup(names, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= names.length) return;
  const next = names.slice();
  [next[i], next[j]] = [next[j], next[i]];
  await saveGroupOrder(next);
}
async function addGroup(name) {
  name = name.trim();
  if (!name) return;
  if (groupNames().some((n) => n.toLocaleLowerCase("nb") === name.toLocaleLowerCase("nb"))) { alert("Det finnes allerede en gruppe med det navnet."); return; }
  await saveGroupOrder([...groupNames(), name]);
}
async function renameGroup(oldName, newName) {
  newName = newName.trim();
  if (!newName || newName === oldName) { render(); return; }
  if (groupNames().some((n) => n !== oldName && n.toLocaleLowerCase("nb") === newName.toLocaleLowerCase("nb"))) { alert("Det finnes allerede en gruppe med det navnet."); render(); return; }
  const c = cats.find((x) => x.name === oldName);
  const affected = items.filter((i) => i.category === oldName);
  const b = writeBatch(db);
  b.set(doc(catsCol, c?.id || slug(newName)), { name: newName, order: groupNames().indexOf(oldName) });
  affected.slice(0, 450).forEach((it) => b.update(doc(db, "items", it.id), { category: newName }));
  await b.commit();
}
async function deleteGroup(name, count) {
  if (count > 0) { alert(`«${name}» har ${count} varer. Flytt eller slett dem først.`); return; }
  if (!confirm(`Slette gruppen «${name}»?`)) return;
  const c = cats.find((x) => x.name === name);
  if (c) await deleteDoc(doc(catsCol, c.id));
}
// Items: rewrite order 0..n for a group's list so swaps are stable
async function moveItem(list, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  const next = list.slice();
  [next[i], next[j]] = [next[j], next[i]];
  await batchOver(next, (b, it) => { const o = next.indexOf(it); if (it.order !== o) b.update(doc(db, "items", it.id), { order: o }); });
}
async function moveItemToGroup(it, group) {
  if (group === it.category) return;
  const inTarget = items.filter((i) => i.category === group);
  const order = inTarget.length ? Math.max(...inTarget.map((i) => i.order ?? 0)) + 1 : 0;
  await upd(it, { category: group, order });
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- UI wiring ----------
$("quickForm").addEventListener("submit", (e) => {
  e.preventDefault();
  addItem($("quickText").value, $("quickCat").value);
  $("quickText").value = "";
});
$("menuBtn").addEventListener("click", () => $("menu").classList.toggle("hidden"));
$("hideDone").addEventListener("change", () => { localStorage.setItem("hideDone", $("hideDone").checked ? "1" : "0"); render(); });
const setMode = (m) => { mode = m; localStorage.setItem("mode", m); window.scrollTo(0, 0); render(); };
$("tabPlan").addEventListener("click", () => setMode("plan"));
$("tabShop").addEventListener("click", () => setMode("shop"));
$("tabEdit").addEventListener("click", () => setMode("edit"));
$("search").addEventListener("input", render);
const bulk = (pred, data, msg) => {
  const l = items.filter(pred);
  $("menu").classList.add("hidden");
  if (l.length && confirm(msg(l.length))) batchOver(l, (b, it) => b.update(doc(db, "items", it.id), data));
};
// Done shopping: ticked items leave the shopping list (back to the master list, unticked)
$("finishShop").addEventListener("click", () => bulk((i) => i.needed && i.checked, { needed: false, checked: false }, (n) => `Fjerne ${n} avkryssede varer fra handlelisten?`));
$("uncheckAll").addEventListener("click", () => bulk((i) => i.needed && i.checked, { checked: false }, (n) => `Fjerne avkryssing på ${n} varer?`));
$("clearNeeded").addEventListener("click", () => bulk((i) => i.needed, { needed: false, checked: false }, (n) => `Tømme hele handlelisten (${n} varer)?`));
$("seedBtn").addEventListener("click", async () => {
  if (items.length) return;
  const seed = await (await fetch("seed.json")).json();
  const rows = [];
  seed.forEach((c) => c.items.forEach((it, i) => rows.push({ text: it.text, category: c.name, needed: false, checked: false, order: i })));
  await batchOver(rows, (b, r) => b.set(doc(itemsCol), { ...r, addedBy: "import", createdAt: serverTimestamp() }));
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
